name: Build Telegram APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task to run"
        required: false
        default: ":TMessagesProj_App:assembleAfatDebug"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Fallbacks; the NDK version is auto-detected from the repo below.
      DEFAULT_NDK_VERSION: "21.4.7075529"
      CMAKE_VERSION: "3.10.2.4988404"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Install NDK and CMake
        run: |
          NDK_VERSION=$(grep -rhoE 'ndkVersion[[:space:]=]+"[0-9]+\.[0-9]+\.[0-9]+"' --include=build.gradle . \
            | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          NDK_VERSION=${NDK_VERSION:-$DEFAULT_NDK_VERSION}
          echo "Using NDK $NDK_VERSION"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

          # sdkmanager needs JDK 17; the rest of the build stays on JDK 11
          export JAVA_HOME="$JAVA_HOME_17_X64"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Inject Telegram API credentials
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          if [ -z "$TG_APP_ID" ] || [ -z "$TG_APP_HASH" ]; then
            echo "::error::Missing repository secrets TG_APP_ID and/or TG_APP_HASH"
            exit 1
          fi
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          sed -i -E "s/(APP_ID = )[0-9]+;/\1${TG_APP_ID};/" "$FILE"
          sed -i -E "s/(APP_HASH = )\"[^\"]*\";/\1\"${TG_APP_HASH}\";/" "$FILE"
          # Print only the non-secret check that the lines were replaced
          grep -c -E "APP_ID = ${TG_APP_ID};" "$FILE"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          TASK="${{ github.event.inputs.gradle_task }}"
          TASK="${TASK:-:TMessagesProj_App:assembleAfatDebug}"
          echo "Running: ./gradlew $TASK"
          ./gradlew $TASK --stacktrace --no-daemon

      - name: List built APKs
        run: find . -name "*.apk" -path "*build/outputs*" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
